set-window-option -g mode-keys vi

###
set -g default-terminal "xterm-256color"
# make colors inside tmux look the same as outside of tmux
# see https://github.com/tmux/tmux/issues/696
# see https://stackoverflow.com/a/41786092
set-option -ga terminal-overrides ",xterm-256color:Tc"
###

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Remap the prefix to Vim prefix, which is Ctrl+w
unbind C-b
set-option -g prefix C-w
bind-key C-w send-prefix

# Vim split keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode key rebind
unbind [
bind space copy-mode

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory: prefix (C-w) + b
bind b new-window -c "#{pane_current_path}"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Popup shell: prefix (C-w) + Shift+p
bind P display-popup -E $SHELL

# Copy without jumping back to the bottom: stay in copy mode after copying
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear

set -g status-bg "#957FB8"
set -g status-fg "#1F1F28"

